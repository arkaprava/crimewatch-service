# Application overlay; merge with the mongo file. Build the war first:
#   ./gradlew bootWar
#   docker compose -f infra/docker-compose-mongo.yml -f infra/docker-compose-app.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: crime-info-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: mongodb://mongodb:27017/crime_info_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CRIME_READ_API_KEY: ${CRIME_READ_API_KEY:-change-me-read}
      CRIME_INGEST_API_KEY: ${CRIME_INGEST_API_KEY:-change-me-ingest}
      # Off by default in prod (see application-prod.yml) since introspection
      # exposes the full schema to anyone who can reach /graphql. Set
      # GRAPHIQL_ENABLED=true in .env to turn the IDE back on for exploring
      # a deployment — /graphql queries still require an API key either way.
      SPRING_GRAPHQL_GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-false}
      SPRING_GRAPHQL_SCHEMA_INTROSPECTION_ENABLED: ${GRAPHIQL_ENABLED:-false}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
